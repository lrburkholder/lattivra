name: M0 conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-m0.txt
      - name: Install pinned harness dependencies
        id: dependencies
        run: python -m pip install -r requirements-m0.txt
      - name: Run contract examples and regression tests
        run: python -m pytest -q --junitxml=artifacts/pytest.xml --contract-report=artifacts/checklist-coverage.json
      - name: Compare fixture inventory and write evidence
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m m0_harness tests/fixtures/corpus.json --output artifacts/conformance.json
      - name: Upload conformance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m0-conformance-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
